apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llmops-control-plane
  namespace: llmops
spec:
  rules:
    - host: llmops.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llmops-control-plane
                port:
                  number: 80
